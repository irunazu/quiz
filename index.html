<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Литературная викторина 6 класс | Былины • Баллады • Фольклор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff6ec4, #7873f5, #4ADEDE, #FFD93D);
    background-size: 400% 400%;
    animation: bgMove 18s ease infinite;
    padding: 20px;
    color: #222;
  }
  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .container { max-width: 820px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 30px 20px;
    background: rgba(255,255,255,0.92);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, #ff6ec4 0%, #7873f5 50%, #4ADEDE 100%);
    opacity: 0.12;
  }
  header h1 {
    position: relative;
    font-size: clamp(22px, 4vw, 36px);
    background: linear-gradient(90deg, #ff2d95, #7c3aed, #06b6d4);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 10px; font-weight: 800;
  }
  header p { position: relative; color: #555; font-size: 16px; }

  .shuffle-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 16px;
    background: linear-gradient(135deg, #4ADEDE, #7873f5);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    border-radius: 20px;
    position: relative;
    box-shadow: 0 4px 12px rgba(120, 115, 245, 0.4);
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 24px;
    margin-bottom: 18px;
    box-shadow: 0 8px 26px rgba(80, 20, 160, 0.15);
    border-left: 8px solid #ff6ec4;
    transition: transform .2s;
    animation: cardAppear 0.4s ease backwards;
  }
  .card:hover { transform: translateY(-2px); }
  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-number {
    display: inline-block;
    background: linear-gradient(135deg, #ff6ec4, #7873f5);
    color: #fff; font-weight: 800;
    width: 38px; height: 38px; line-height: 38px;
    text-align: center; border-radius: 50%;
    margin-right: 12px;
    box-shadow: 0 4px 12px rgba(120, 115, 245, 0.5);
    flex-shrink: 0;
  }
  .q-title {
    display: flex; align-items: flex-start;
    font-size: 17px; font-weight: 600;
    margin-bottom: 14px; line-height: 1.4;
  }
  .q-title span:last-child { padding-top: 7px; }

  input[type="text"], textarea {
    width: 100%; padding: 13px 16px;
    border: 2px solid #e5e7ff; border-radius: 12px;
    font-size: 15px; font-family: inherit;
    background: #fafaff; transition: all .2s;
    resize: vertical; min-height: 48px;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: #7873f5;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(120,115,245,0.15);
  }

  .name-box {
    text-align: center; padding: 30px 24px;
    background: linear-gradient(135deg, #fff6fb, #f0f4ff);
    border-radius: 20px; margin-bottom: 24px;
    border-left: 8px solid #7873f5;
    box-shadow: 0 8px 26px rgba(80, 20, 160, 0.15);
  }
  .name-box label {
    display: block; font-size: 18px; font-weight: 700;
    color: #4c1d95; margin-bottom: 14px;
  }

  .btn {
    display: inline-block; padding: 16px 42px;
    border: none; border-radius: 50px;
    font-size: 17px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #ff2d95, #7c3aed);
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(124, 58, 237, 0.45);
    transition: transform .15s, box-shadow .2s;
    font-family: inherit; letter-spacing: 0.3px;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(124, 58, 237, 0.55); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .submit-area { text-align: center; padding: 20px 0 10px; }

  .success {
    display: none; padding: 40px 30px;
    background: #fff; border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    border-top: 10px solid #4ADEDE;
  }
  .success .big-emoji { font-size: 72px; margin-bottom: 10px; display: block; animation: pop 0.6s ease; text-align: center; }
  @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .success h2 {
    font-size: 26px; text-align: center;
    background: linear-gradient(90deg, #ff2d95, #7873f5);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; margin-bottom: 20px;
  }

  .score-circle {
    width: 160px; height: 160px; border-radius: 50%;
    margin: 20px auto;
    background: conic-gradient(#7c3aed 0deg, #ff2d95 360deg);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 8px 26px rgba(124, 58, 237, 0.35);
  }
  .score-circle::before {
    content: ""; position: absolute; inset: 8px;
    border-radius: 50%; background: #fff;
  }
  .score-inner {
    position: relative; z-index: 1;
    display: flex; align-items: baseline; gap: 2px;
  }
  .score-inner #scoreValue {
    font-size: 52px; font-weight: 800;
    background: linear-gradient(135deg, #ff2d95, #7c3aed);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    line-height: 1;
  }
  .score-inner .score-total { font-size: 22px; font-weight: 700; color: #aaa; }

  #scoreMessage {
    text-align: center; font-size: 17px;
    font-weight: 600; color: #4c1d95;
    margin-bottom: 24px;
  }

  .results-review {
    background: linear-gradient(135deg, #fef6ff, #f0f4ff);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .results-review h3 {
    font-size: 16px; color: #4c1d95;
    margin-bottom: 14px; text-align: center;
  }
  .review-item {
    display: flex; gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7ff;
    font-size: 14px;
    line-height: 1.5;
  }
  .review-item:last-child { border-bottom: none; }
  .review-mark { font-size: 18px; flex-shrink: 0; }
  .review-content { flex: 1; }
  .review-q { color: #333; margin-bottom: 4px; }
  .review-student { color: #555; font-style: italic; }
  .review-student strong { color: #7c3aed; font-style: normal; }
  .review-correct { color: #059669; font-size: 13px; margin-top: 3px; }
  .review-item.wrong .review-correct { color: #e11d48; }

  .email-status {
    text-align: center; font-size: 14px;
    padding: 10px; border-radius: 10px;
    margin-bottom: 20px;
  }
  .email-status.sending { background: #fef3c7; color: #92400e; }
  .email-status.sent { background: #d1fae5; color: #065f46; }
  .email-status.error { background: #fee2e2; color: #991b1b; }

  footer {
    text-align: center; padding: 24px 10px;
    color: #fff; font-size: 14px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  footer a { color: #fff; text-decoration: underline; cursor: pointer; opacity: 0.85; }
  footer a:hover { opacity: 1; }

  .admin-panel {
    display: none; background: #fff;
    border-radius: 24px; padding: 26px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    border-top: 10px solid #ff2d95;
  }
  .admin-panel h2 {
    font-size: 24px; margin-bottom: 18px;
    background: linear-gradient(90deg, #ff2d95, #7873f5);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .admin-header {
    display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap;
    gap: 12px; margin-bottom: 20px;
  }
  .submission {
    background: linear-gradient(135deg, #fef6ff, #f0f4ff);
    border-radius: 14px; padding: 16px;
    margin-bottom: 14px;
    border-left: 5px solid #7873f5;
  }
  .submission .meta {
    display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px; font-weight: 700;
    color: #4c1d95;
  }
  .submission .meta .date { font-weight: 500; color: #888; font-size: 13px; }
  .submission .score-badge {
    display: inline-block;
    padding: 3px 12px; border-radius: 20px;
    font-size: 13px; font-weight: 700;
    color: #fff; margin-left: 6px;
  }
  .score-badge.good { background: linear-gradient(135deg, #10b981, #059669); }
  .score-badge.mid { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .score-badge.bad { background: linear-gradient(135deg, #ef4444, #dc2626); }

  .answers { font-size: 14px; line-height: 1.6; color: #333; }
  .answers .a-item { margin-bottom: 8px; padding: 6px 0; border-bottom: 1px dashed #e5e7ff; }
  .answers .a-item:last-child { border-bottom: none; }
  .answers .q-label { color: #7c3aed; font-weight: 600; }
  .answers .correct-line { color: #059669; font-size: 13px; }
  .answers .correct-line.wrong { color: #e11d48; }

  .empty { text-align: center; color: #999; padding: 30px; font-style: italic; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000; align-items: center;
    justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff; border-radius: 20px;
    padding: 32px; max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .modal h3 { margin-bottom: 16px; color: #4c1d95; font-size: 20px; }
  .modal input { margin-bottom: 16px; text-align: center; }
  .modal .error { color: #e11d48; font-size: 14px; margin-bottom: 10px; display: none; }
  .modal .error.show { display: block; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; }
  .btn-sm { padding: 12px 26px; font-size: 15px; }
  .btn-ghost {
    background: transparent; color: #7873f5;
    border: 2px solid #7873f5; box-shadow: none;
  }
  .btn-ghost:hover { background: #f0f4ff; box-shadow: none; }
  .btn-danger { background: linear-gradient(135deg, #e11d48, #be123c); box-shadow: 0 8px 22px rgba(225,29,72,0.45); }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .card, .name-box, .admin-panel, .success { padding: 20px 16px; }
    .q-title { font-size: 15px; }
    .btn { padding: 14px 30px; font-size: 16px; }
    .score-circle { width: 130px; height: 130px; }
    .score-inner #scoreValue { font-size: 42px; }
  }
</style>
</head>
<body>

<div class="container">

  <div id="quizView">
    <header>
      <h1>✨ Литературная викторина 6 класс ✨</h1>
      <p>Баллады • Былины • Фольклор — 15 вопросов</p>
      <span class="shuffle-badge">🎲 Вопросы в случайном порядке</span>
    </header>

    <div class="name-box">
      <label for="studentName">👤 Введите ваше имя и фамилию</label>
      <input type="text" id="studentName" placeholder="Например: Иванов Пётр" maxlength="60" autocomplete="off">
    </div>

    <form id="quizForm"></form>

    <div class="submit-area">
      <button type="button" class="btn" id="submitBtn">📨 Отправить результат</button>
    </div>
  </div>

  <div class="success" id="successView">
    <span class="big-emoji">🎉</span>
    <h2>Спасибо, <span id="successName"></span>!</h2>

    <div class="score-circle">
      <div class="score-inner">
        <span id="scoreValue">0</span>
        <span class="score-total">/ 15</span>
      </div>
    </div>
    <p id="scoreMessage"></p>

    <div class="results-review" id="resultsReview"></div>

    <p class="email-status" id="emailStatus"></p>

    <div style="text-align:center">
      <button class="btn btn-sm" onclick="location.reload()">Пройти снова</button>
    </div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-header">
      <h2>👩‍🏫 Результаты учеников</h2>
      <div>
        <button class="btn btn-sm btn-ghost" onclick="exportResults()">💾 Экспорт</button>
        <button class="btn btn-sm btn-danger" onclick="clearAll()">🗑 Очистить</button>
        <button class="btn btn-sm btn-ghost" onclick="logout()">Выйти</button>
      </div>
    </div>
    <div id="submissionsList"></div>
  </div>

</div>

<footer>
  © Литературная викторина 6 класс • <a id="adminLink">Вход для учителя</a>
</footer>

<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <h3>🔐 Вход для учителя</h3>
    <div class="error" id="pwdError">Неверный пароль</div>
    <input type="password" id="pwdInput" placeholder="Пароль" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-sm" onclick="checkPassword()">Войти</button>
    </div>
  </div>
</div>

<script>
/* =================================================================
   ⚙️ НАСТРОЙКИ
   ================================================================= */
const TEACHER_EMAIL = "teacher@example.com"; // ← ЗАМЕНИТЕ НА СВОЙ EMAIL
const TEACHER_PASSWORD = "teacher2024";      // ← пароль учителя
const STORAGE_KEY = "quiz_results_6class_v1";

/* =================================================================
   📚 БАНК ВОПРОСОВ
   ================================================================= */
const QUESTIONS_BANK = [
  // --- Кубок ---
  {
    text: "Кто автор баллады «Кубок»?",
    keywords: ["жуковск"],
    correct: "В. А. Жуковский (перевод баллады Ф. Шиллера)"
  },
  // --- Илья Муромец и Соловей-разбойник ---
  {
    text: "Как звали богатыря, который победил Соловья-разбойника и привёз его в Киев к князю Владимиру?",
    keywords: ["илья", "муромец"],
    correct: "Илья Муромец"
  },
  {
    text: "Где сидел Соловей-разбойник, поджидая путников?",
    keywords: ["смородин", "дуб", "река", "реки", "дорог"],
    correct: "У реки Смородины, на дубах (на прямой дороге)"
  },
  // --- Песнь о Роланде ---
  {
    text: "Кто предал Роланда и его войско в «Песни о Роланде»?",
    keywords: ["ганелон"],
    correct: "Ганелон"
  },
  {
    text: "Как называется боевой рог рыцаря Роланда?",
    keywords: ["олифант"],
    correct: "Олифант"
  },
  // --- Вересковый мёд ---
  {
    text: "Какой древний народ варил вересковый мёд в балладе Р. Л. Стивенсона?",
    keywords: ["пикт"],
    correct: "Пикты"
  },
  {
    text: "Кого старик-пикт убил, чтобы тайна верескового мёда не досталась королю?",
    keywords: ["сын"],
    correct: "Своего сына"
  },
  // --- Перчатка ---
  {
    text: "Кто перевёл балладу «Перчатка» на русский язык?",
    keywords: ["жуковск"],
    correct: "В. А. Жуковский (перевод баллады Ф. Шиллера)"
  },
  {
    text: "Что сделал рыцарь Делорж, достав перчатку со дна ямы со львами?",
    keywords: ["бросил", "в лицо", "уехал", "покинул", "ушел", "ушёл", "отверг"],
    correct: "Бросил перчатку в лицо даме и уехал (отверг её)"
  },
  // --- Садко ---
  {
    text: "На каком музыкальном инструменте играл Садко?",
    keywords: ["гусл"],
    correct: "Гусли"
  },
  {
    text: "Кто спас Садко из подводного царства?",
    keywords: ["микола", "можайск", "николай"],
    correct: "Микола Можайский (святой Николай Угодник)"
  },
  // --- Вольга и Микула Селянинович ---
  {
    text: "Кем был Микула Селянинович в былине о Вольге?",
    keywords: ["пахарь", "крестьян", "землепаш", "оратай"],
    correct: "Пахарь (крестьянин-землепашец)"
  },
  // --- Теория: фольклор, баллада, былина ---
  {
    text: "Что такое фольклор?",
    keywords: ["устное народное", "народное творчество"],
    correct: "Устное народное творчество"
  },
  {
    text: "Как называется стихотворное произведение с напряжённым сюжетом, часто повествующее о трагических или фантастических событиях?",
    keywords: ["баллад"],
    correct: "Баллада"
  },
  {
    text: "Как называется русская народная эпическая песня о подвигах богатырей?",
    keywords: ["былин"],
    correct: "Былина"
  }
];

/* =================================================================
   🔀 ПЕРЕМЕШИВАНИЕ (алгоритм Фишера–Йетса)
   ================================================================= */
function shuffleArray(arr) {
  const a = arr.slice(); // не мутируем оригинал
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =================================================================
   🎲 ФОРМИРУЕМ СЛУЧАЙНЫЙ НАБОР ВОПРОСОВ
   ================================================================= */
// Перемешиваем весь банк и берём все 15 (их ровно 15, поэтому выйдут все,
// но в разном порядке). Если в банке станет больше вопросов — можно взять
// только часть. Например, чтобы каждый раз было 10 вопросов из 15:
//   const questions = shuffleArray(QUESTIONS_BANK).slice(0, 10);
const QUESTIONS = shuffleArray(QUESTIONS_BANK);

/* =================================================================
   🧠 ПРОВЕРКА ОТВЕТОВ
   ================================================================= */
function normalize(str) {
  return String(str)
    .toLowerCase()
    .replace(/ё/g, "е")
    .replace(/\s+/g, " ")
    .trim();
}

function isAnswerCorrect(userAnswer, keywords) {
  const norm = normalize(userAnswer);
  if (!norm) return false;
  return keywords.some(k => norm.includes(normalize(k)));
}

/* =================================================================
   🖼 РЕНДЕР ФОРМЫ
   ================================================================= */
const form = document.getElementById("quizForm");
const borderColors = ["#ff6ec4", "#7873f5", "#4ADEDE", "#FFD93D", "#ff2d95"];

QUESTIONS.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.borderLeftColor = borderColors[i % borderColors.length];
  card.style.animationDelay = (i * 0.05) + "s";
  card.innerHTML = `
    <div class="q-title">
      <span class="question-number">${i + 1}</span>
      <span>${q.text}</span>
    </div>
    <textarea id="q${i}" rows="2" placeholder="Ваш ответ..." maxlength="500"></textarea>
  `;
  form.appendChild(card);
});

/* =================================================================
   📨 ОТПРАВКА РЕЗУЛЬТАТА
   ================================================================= */
const submitBtn = document.getElementById("submitBtn");

submitBtn.addEventListener("click", async () => {
  const name = document.getElementById("studentName").value.trim();
  if (!name) {
    alert("Пожалуйста, введите ваше имя!");
    document.getElementById("studentName").focus();
    return;
  }

  let score = 0;
  const results = QUESTIONS.map((q, i) => {
    const userAnswer = document.getElementById("q" + i).value.trim();
    const correct = isAnswerCorrect(userAnswer, q.keywords);
    if (correct) score++;
    return {
      question: q.text,
      answer: userAnswer || "(нет ответа)",
      correct: q.correct,
      isCorrect: correct
    };
  });

  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  saved.push({
    name,
    score,
    total: QUESTIONS.length,
    answers: results,
    date: new Date().toLocaleString("ru-RU")
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  showResults(name, score, results);
  sendEmailToTeacher(name, score, results);
});

/* =================================================================
   🎬 ЭКРАН РЕЗУЛЬТАТА
   ================================================================= */
function showResults(name, score, results) {
  document.getElementById("quizView").style.display = "none";
  document.getElementById("successView").style.display = "block";
  document.getElementById("successName").textContent = name;
  document.getElementById("scoreValue").textContent = score;
  document.querySelector(".score-total").textContent = "/ " + QUESTIONS.length;

  const total = QUESTIONS.length;
  const percent = Math.round((score / total) * 100);

  let message = "";
  if (percent === 100) message = "🏆 Блестяще! Ты настоящий знаток литературы!";
  else if (percent >= 80) message = "🌟 Отличный результат! Совсем немного до идеала.";
  else if (percent >= 60) message = "👍 Хорошо! Есть куда расти.";
  else if (percent >= 40) message = "📖 Неплохо, но стоит повторить материал.";
  else message = "💪 Не расстраивайся — перечитай тему и попробуй снова!";
  document.getElementById("scoreMessage").textContent = message;

  const review = document.getElementById("resultsReview");
  review.innerHTML = `
    <h3>Разбор ответов</h3>
    ${results.map((r, i) => `
      <div class="review-item ${r.isCorrect ? "correct" : "wrong"}">
        <span class="review-mark">${r.isCorrect ? "✅" : "❌"}</span>
        <div class="review-content">
          <div class="review-q">${i + 1}. ${r.question}</div>
          <div class="review-student">Ваш ответ: <strong>${escapeHtml(r.answer)}</strong></div>
          ${r.isCorrect ? "" : `<div class="review-correct">Правильно: ${escapeHtml(r.correct)}</div>`}
        </div>
      </div>
    `).join("")}
  `;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =================================================================
   ✉️ ОТПРАВКА EMAIL УЧИТЕЛЮ
   ================================================================= */
async function sendEmailToTeacher(name, score, results) {
  const statusEl = document.getElementById("emailStatus");

  if (!TEACHER_EMAIL || TEACHER_EMAIL === "ilmiralove78@mail.ru") {
    statusEl.textContent = "ℹ️ Email учителя не настроен (см. TEACHER_EMAIL в коде).";
    statusEl.className = "email-status error";
    return;
  }

  statusEl.textContent = "⏳ Отправляем результат учителю...";
  statusEl.className = "email-status sending";

  const total = QUESTIONS.length;
  let body = `Ученик: ${name}\n`;
  body += `Результат: ${score} из ${total} (${Math.round(score/total*100)}%)\n`;
  body += `Дата: ${new Date().toLocaleString("ru-RU")}\n`;
  body += "=".repeat(50) + "\n\n";

  results.forEach((r, i) => {
    body += `${i + 1}. ${r.question}\n`;
    body += `   Ответ ученика: ${r.answer}\n`;
    body += `   Правильный ответ: ${r.correct}\n`;
    body += `   ${r.isCorrect ? "✓ Верно" : "✗ Неверно"}\n\n`;
  });

  try {
    const response = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(TEACHER_EMAIL)}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        _subject: `📚 Викторина 6 класс: ${name} — ${score}/${total}`,
        _template: "box",
        _captcha: "false",
        "Ученик": name,
        "Результат": `${score} из ${total}`,
        "Подробности": body
      })
    });

    if (response.ok) {
      statusEl.textContent = "✅ Результат отправлен учителю на email!";
      statusEl.className = "email-status sent";
    } else {
      throw new Error("Ошибка отправки");
    }
  } catch (err) {
    console.warn("Email error:", err);
    statusEl.textContent = "⚠️ Не удалось отправить email, но результат сохранён на сайте.";
    statusEl.className = "email-status error";
  }
}

/* =================================================================
   👩‍🏫 АДМИН-ПАНЕЛЬ
   ================================================================= */
const adminLink = document.getElementById("adminLink");
const pwdModal = document.getElementById("pwdModal");
const pwdInput = document.getElementById("pwdInput");
const pwdError = document.getElementById("pwdError");

adminLink.addEventListener("click", () => {
  if (sessionStorage.getItem("teacherAuth") === "1") {
    showAdmin();
  } else {
    pwdModal.classList.add("active");
    pwdInput.value = "";
    pwdError.classList.remove("show");
    setTimeout(() => pwdInput.focus(), 100);
  }
});

pwdInput.addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

function checkPassword() {
  if (pwdInput.value === TEACHER_PASSWORD) {
    sessionStorage.setItem("teacherAuth", "1");
    closeModal();
    showAdmin();
  } else {
    pwdError.classList.add("show");
    pwdInput.value = "";
    pwdInput.focus();
  }
}

function closeModal() { pwdModal.classList.remove("active"); }

function showAdmin() {
  document.getElementById("quizView").style.display = "none";
  document.getElementById("successView").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  renderSubmissions();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function logout() {
  sessionStorage.removeItem("teacherAuth");
  location.reload();
}

function renderSubmissions() {
  const list = document.getElementById("submissionsList");
  const results = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  if (results.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет отправленных работ 📭</div>';
    return;
  }

  list.innerHTML = results.slice().reverse().map(r => {
    const percent = Math.round((r.score / r.total) * 100);
    const cls = percent >= 80 ? "good" : percent >= 50 ? "mid" : "bad";
    return `
      <div class="submission">
        <div class="meta">
          <span>👤 ${escapeHtml(r.name)}
            <span class="score-badge ${cls}">${r.score}/${r.total}</span>
          </span>
          <span class="date">🕒 ${r.date}</span>
        </div>
        <div class="answers">
          ${r.answers.map((a, i) => `
            <div class="a-item">
              <span class="q-label">${i + 1}.</span> ${escapeHtml(a.answer)}
              <div class="correct-line ${a.isCorrect ? "" : "wrong"}">
                ${a.isCorrect ? "✓ Верно" : "✗ Правильно: " + escapeHtml(a.correct)}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function clearAll() {
  if (confirm("Удалить все результаты? Это действие необратимо.")) {
    localStorage.removeItem(STORAGE_KEY);
    renderSubmissions();
  }
}

function exportResults() {
  const results = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (results.length === 0) { alert("Нет данных для экспорта."); return; }

  let text = "РЕЗУЛЬТАТЫ ВИКТОРИНЫ (6 класс)\n\n";
  results.forEach((r, i) => {
    text += `${i + 1}. ${r.name} — ${r.score}/${r.total} (${r.date})\n`;
    r.answers.forEach((a, j) => {
      text += `   ${j + 1}) ${a.question}\n`;
      text += `      Ответ: ${a.answer}\n`;
      text += `      Правильно: ${a.correct}\n`;
      text += `      ${a.isCorrect ? "✓" : "✗"}\n`;
    });
    text += "\n" + "-".repeat(50) + "\n\n";
  });

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "результаты_викторины_6класс.txt";
  a.click();
}
