<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Литературная викторина 6 класс | Былины • Баллады • Фольклор</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div id="quizView">
        <header>
          <h1>✨ Литературная викторина 6 класс ✨</h1>
          <p>Баллады • Былины • Фольклор — 15 вопросов</p>
          <span class="shuffle-badge">🎲 Вопросы в случайном порядке</span>
        </header>

        <div class="name-box">
          <label for="studentName">👤 Введите ваше имя и фамилию</label>
          <input
            type="text"
            id="studentName"
            placeholder="Например: Иванов Пётр"
            maxlength="60"
            autocomplete="off"
          />
        </div>

        <form id="quizForm"></form>

        <div class="submit-area">
          <button type="button" class="btn" id="submitBtn">
            📨 Отправить результат
          </button>
        </div>
      </div>

      <div class="success" id="successView">
        <span class="big-emoji">🎉</span>
        <h2>Спасибо, <span id="successName"></span>!</h2>

        <div class="score-circle">
          <div class="score-inner">
            <span id="scoreValue">0</span>
            <span class="score-total">/ 15</span>
          </div>
        </div>
        <p id="scoreMessage"></p>

        <div class="results-review" id="resultsReview"></div>

        <p class="email-status" id="emailStatus"></p>

        <div style="text-align: center">
          <button class="btn btn-sm" onclick="location.reload()">
            Пройти снова
          </button>
        </div>
      </div>

      <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
          <h2>👩‍🏫 Результаты учеников</h2>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="exportResults()">
              💾 Экспорт
            </button>
            <button class="btn btn-sm btn-danger" onclick="clearAll()">
              🗑 Очистить
            </button>
            <button class="btn btn-sm btn-ghost" onclick="logout()">
              Выйти
            </button>
          </div>
        </div>
        <div id="submissionsList"></div>
      </div>
    </div>

    <footer>
      © Литературная викторина 6 класс • <a id="adminLink">Вход для учителя</a>
    </footer>

    <div class="modal-overlay" id="pwdModal">
      <div class="modal">
        <h3>🔐 Вход для учителя</h3>
        <div class="error" id="pwdError">Неверный пароль</div>
        <input
          type="password"
          id="pwdInput"
          placeholder="Пароль"
          autocomplete="off"
        />
        <div class="modal-btns">
          <button class="btn btn-sm btn-ghost" onclick="closeModal()">
            Отмена
          </button>
          <button class="btn btn-sm" onclick="checkPassword()">Войти</button>
        </div>
      </div>
    </div>
  </body>
</html>
